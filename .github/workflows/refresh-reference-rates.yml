# Keeps reference-rates.json (Fed Funds, SONIA, S&P dividend yield) current, so
# the cost model's financing leg and the cost cap use the rate actually in force.
# Runs on the 3rd of each month (after the previous month's last rates are out)
# and can be started by hand from the Actions tab. Public sources only — no keys.
name: Refresh reference rates

on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed file
  pages: write      # ask GitHub Pages to rebuild (see below)

concurrency:
  group: refresh-reference-rates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script uses only the standard library. It exits non-zero if any
      # source failed, but still writes the series that did update (a failed
      # one keeps its previous data) — so commit first, then report the failure.
      - name: Rebuild reference-rates.json
        id: build
        run: |
          set +e
          python tools/build_reference_data.py
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- reference-rates.json; then
            echo "No change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-rates.json
          git commit -m "Refresh reference rates ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not trigger other workflows, which
      # includes GitHub Pages' own build — so request one explicitly.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Fail if a source could not be fetched
        if: steps.build.outputs.status != '0'
        run: |
          echo "::error::One or more reference series could not be fetched; they kept their previous data. See the build step's log."
          exit 1
