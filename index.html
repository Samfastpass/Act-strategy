<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy tracker</title>
<style>
  :root {
    --ink: #16181c; --ink-soft: #5b6069; --ink-faint: #9498a1;
    --line: #dfe1e6; --paper: #fbfbfa; --card: #ffffff;
    --long: #1a5c3f; --long-bg: #e7f3ec;
    --flat: #8a6d1f; --flat-bg: #faf2df;
    --warn: #9c2b2b; --warn-bg: #fbe9e9;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eceef1; --ink-soft: #a8adb6; --ink-faint: #71767f;
      --line: #2b2e34; --paper: #121316; --card: #191b1f;
      --long: #7fd4ac; --long-bg: #163325;
      --flat: #e6c05e; --flat-bg: #322a13;
      --warn: #e88989; --warn-bg: #351b1b;
    }
  }
  * { box-sizing: border-box; }
  body { font-family: var(--sans); color: var(--ink); background: var(--paper); margin: 0; padding: 1.5rem 1.25rem 3rem; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .masthead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 8px; }
  .masthead h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .masthead .asof { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }
  .tabnav { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .tabnav .tab { background: none; border: none; padding: 8px 4px; margin-right: 20px; font-size: 13px; font-weight: 600; font-family: inherit; color: var(--ink-faint); cursor: pointer; border-bottom: 2px solid transparent; }
  .tabnav .tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-head .name { font-size: 14px; font-weight: 600; }
  .card-head .sub { font-size: 11px; color: var(--ink-faint); font-family: var(--mono); }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 100px; font-family: var(--mono); letter-spacing: 0.01em; }
  .badge.long { color: var(--long); background: var(--long-bg); }
  .badge.flat { color: var(--flat); background: var(--flat-bg); }
  .statrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .statrow.cagr-row { grid-template-columns: repeat(4, 1fr); }
  .stat { border-left: 2px solid var(--line); padding-left: 10px; }
  .stat .k { font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; }
  .stat .v { font-family: var(--mono); font-size: 18px; font-weight: 600; }
  .meter-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); margin-bottom: 5px; }
  .meter-label .num { font-family: var(--mono); color: var(--ink); }
  .meter { position: relative; height: 6px; background: var(--line); border-radius: 3px; margin-bottom: 16px; }
  .meter .fill { position: absolute; top: 0; height: 6px; border-radius: 3px; background: var(--long); }
  .meter .mark { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--ink); border-radius: 1px; }
  .meter .zero { position: absolute; top: -2px; width: 1px; height: 10px; background: var(--ink-faint); }
  .footline { display: flex; justify-content: space-between; font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .footline .k { color: var(--ink-soft); }
  .footline .v { font-family: var(--mono); font-weight: 600; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px 18px; margin-bottom: 14px; }
  .panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; }
  .formrow { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
  .field label { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 5px; }
  .field input, .field select { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font-family: var(--mono); font-size: 13px; padding: 0 9px; }
  .field input:focus, .field select:focus { outline: 2px solid var(--long); outline-offset: -1px; }
  button.add { height: 34px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 600; cursor: pointer; }
  button.add:active { transform: scale(0.98); }
  .errtext { font-size: 12px; color: var(--warn); margin-top: 8px; }
  table.hist { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.hist th { text-align: right; font-weight: 500; color: var(--ink-faint); font-size: 11px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.hist th:first-child, table.hist td:first-child { text-align: left; }
  table.hist td { text-align: right; padding: 6px 8px; font-family: var(--mono); border-bottom: 1px solid var(--line); }
  .histwrap { max-height: 220px; overflow-y: auto; }
  .toolsrow { font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 10px; }
  .loading, .fatal { font-size: 13px; color: var(--ink-faint); padding: 2rem 0; text-align: center; }
  .fatal { color: var(--warn); }
  .dropzone { border: 1px dashed var(--line); border-radius: 8px; padding: 20px; text-align: center; font-size: 13px; color: var(--ink-soft); cursor: pointer; margin-top: 4px; }
  .dropzone:hover, .dropzone:focus { border-color: var(--ink-faint); outline: none; }

  .badge.shelved { color: var(--ink-faint); background: var(--line); font-weight: 500; margin-left: 4px; }
  .card-click { cursor: pointer; transition: border-color 0.12s ease; }
  .card-click:hover, .card-click:focus-visible { border-color: var(--ink-faint); outline: none; }
  .card-open { border-color: var(--ink); }
  .expandhint { font-style: normal; color: var(--ink-soft); }
  .muted { color: var(--ink-faint); font-weight: 400; }
  .tradehint { font-size: 12px; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 8px; margin-top: -1px; }
  .tradehint.due { color: var(--warn); font-weight: 600; }

  .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .detail-head h2 { margin: 0; }
  .winbtns { display: flex; gap: 4px; flex-wrap: wrap; }
  .winbtn { font-family: var(--mono); font-size: 11px; padding: 4px 9px; border-radius: 5px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); cursor: pointer; }
  .winbtn:hover { border-color: var(--ink-faint); }
  .winbtn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .chart-wrap { width: 100%; overflow-x: auto; }
  .chart { width: 100%; height: auto; display: block; }
  .ch-grid { stroke: var(--line); stroke-width: 1; }
  .ch-axis { fill: var(--ink-faint); font-family: var(--mono); font-size: 9px; }
  .ch-hold { fill: none; stroke: var(--ink-faint); stroke-width: 1.2; }
  .ch-strat { fill: none; stroke: var(--long); stroke-width: 1.6; }
  .ch-strip-bg { fill: var(--line); opacity: 0.35; }
  .ch-expo { fill: var(--long); opacity: 0.75; }
  .ch-legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--ink-soft); margin-top: 6px; }
  .ch-legend b { font-family: var(--mono); color: var(--ink); }
  .ch-legend i { display: inline-block; width: 10px; height: 2px; margin-right: 5px; vertical-align: middle; }
  .ch-legend .sw-strat { background: var(--long); }
  .ch-legend .sw-hold { background: var(--ink-faint); }
  .ch-note { color: var(--ink-faint); font-style: italic; }

  /* Four CAGR figures don't fit across a phone-width card — wrap to 2x2. */
  @media (max-width: 460px) {
    .statrow.cagr-row { grid-template-columns: repeat(2, 1fr); }
    .detail-head { align-items: flex-start; }
  }

  .winbtn[disabled] { opacity: 0.35; cursor: not-allowed; }
  .cost-grid { display: grid; gap: 12px; margin-bottom: 10px; }
  .cost-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
  .cost-row label { flex: 1 1 320px; color: var(--ink-soft); }
  .cost-row input[type="number"] { width: 90px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font-family: var(--mono); font-size: 12px; padding: 0 8px; }
  .cost-row .cost-static { font-family: var(--mono); font-weight: 600; min-width: 60px; }
  .conf-badge { font-size: 10px; font-family: var(--mono); padding: 2px 7px; border-radius: 100px; letter-spacing: 0.02em; }
  .conf-badge.conf-sourced { color: var(--long); background: var(--long-bg); }
  .conf-badge.conf-estimated { color: var(--flat); background: var(--flat-bg); }
  .conf-badge.conf-edited { color: var(--ink-soft); background: var(--line); }
  .src-list { margin: 6px 0 0; padding-left: 18px; }
  .src-list li { margin-bottom: 3px; }
  .cost-row .toolsrow { flex-basis: 100%; }
  .toolsrow a, .src-list a { color: var(--ink-soft); text-decoration: underline; }
  .toolsrow details summary { cursor: pointer; }
  .src-date { color: var(--ink-faint); }

  .oddswrap { overflow-x: auto; }
  table.odds { min-width: 560px; }
  table.odds tr.cur td { background: var(--long-bg); }
  table.odds tr.thin td { color: var(--ink-faint); }

  /* ---- S&P leverage explorer ---- */
  /* Diverging heatmap ramp: blue (positive) / red (negative) with a neutral
     midpoint. Blue-vs-red rather than the site's green/red because the fill IS
     the encoding here, and red-green is the worst pairing for the commonest
     colour blindness. Every step is contrast-checked so the numbers printed
     inside each cell stay >=4.5:1 against --ink. Dark steps are selected for
     the dark surface, not flipped. */
  :root {
    --cell-neg4: #ea8a89; --cell-neg3: #f3b0af; --cell-neg2: #fad9d8; --cell-neg1: #fdecec;
    --cell-mid:  #f0efec;
    --cell-pos1: #eaf2fd; --cell-pos2: #cde2fb; --cell-pos3: #9ec5f4; --cell-pos4: #6da7ec;
    --cell-ruin: #e8e6e1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --cell-neg4: #c03b3b; --cell-neg3: #96302f; --cell-neg2: #5c2020; --cell-neg1: #3a1a1a;
      --cell-mid:  #383835;
      --cell-pos1: #16283c; --cell-pos2: #1c3a5c; --cell-pos3: #1c5cab; --cell-pos4: #256abf;
      --cell-ruin: #2a2723;
    }
  }
  .exp-controls { display: flex; flex-wrap: wrap; gap: 14px 20px; margin-bottom: 12px; }
  .exp-ctl label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 4px; }
  .exp-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 11px; color: var(--ink-soft); margin-bottom: 12px; }
  .exp-legend .lg-ramp { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .exp-legend .lg-ramp i { width: 16px; height: 10px; display: block; }
  .exp-legend .lg-end { font-family: var(--mono); color: var(--ink); }
  .exp-legend .lg-note { flex-basis: 100%; color: var(--ink-faint); font-style: italic; }

  .matrixwrap { overflow-x: auto; }
  table.matrix { border-collapse: separate; border-spacing: 2px; font-size: 12px; min-width: 560px; }
  table.matrix th { font-weight: 500; color: var(--ink-faint); font-size: 11px; font-family: var(--mono); padding: 4px 6px; text-align: center; }
  table.matrix th.corner { text-align: left; color: var(--ink-soft); }
  table.matrix tbody th { text-align: right; }
  td.mcell { padding: 7px 4px; text-align: center; border-radius: 5px; cursor: pointer; line-height: 1.25; outline: none; }
  td.mcell .c-main { display: block; font-family: var(--mono); font-weight: 600; font-size: 12px; color: var(--ink); }
  td.mcell .c-sub { display: block; font-family: var(--mono); font-size: 10px; color: var(--ink-soft); }
  td.mcell:hover, td.mcell:focus-visible { box-shadow: 0 0 0 2px var(--ink-faint); }
  td.mcell.is-live { box-shadow: inset 0 0 0 2px var(--ink); }
  td.mcell.is-sel { box-shadow: 0 0 0 2px var(--ink); }
  .cell-neg4 { background: var(--cell-neg4); } .cell-neg3 { background: var(--cell-neg3); }
  .cell-neg2 { background: var(--cell-neg2); } .cell-neg1 { background: var(--cell-neg1); }
  .cell-mid  { background: var(--cell-mid); }
  .cell-pos1 { background: var(--cell-pos1); } .cell-pos2 { background: var(--cell-pos2); }
  .cell-pos3 { background: var(--cell-pos3); } .cell-pos4 { background: var(--cell-pos4); }
  .cell-na   { background: transparent; }
  .cell-na .c-main { color: var(--ink-faint); }
  /* Ruined cells sit outside the ramp entirely — hatched so they read as a
     different kind of thing, not just "a very bad number". */
  .cell-ruined { background: var(--cell-ruin); background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(156,43,43,0.28) 4px 8px); }
  .cell-ruined .c-main { color: var(--warn); font-size: 10px; letter-spacing: 0.03em; }

  /* Exposure blocks on the Developed equity chart. Colour is a convenience,
     never the sole encoding — the height strip and legend carry the level too,
     since green vs amber is a hard pair for red-green colour blindness. */
  .ch-blk.blk-full { fill: var(--long); opacity: 0.13; }
  .ch-blk.blk-reduced { fill: var(--flat); opacity: 0.20; }
  .ch-legend .sw-blk-full { background: var(--long); opacity: 0.45; height: 8px; }
  .ch-legend .sw-blk-reduced { background: var(--flat); opacity: 0.6; height: 8px; }

  /* Performance + underwater chart (explorer) */
  .winbtns.sub { margin: -4px 0 10px; }
  .pf-zero { stroke: var(--ink-faint); stroke-width: 1; }
  .pf-uw { fill: var(--warn); opacity: 0.22; stroke: var(--warn); stroke-width: 1; stroke-opacity: 0.55; }
  .pf-worst { fill: var(--warn); stroke: var(--card); stroke-width: 1.5; }
  .pf-worsttext { fill: var(--warn); font-family: var(--mono); font-size: 9px; }
  .pf-ruinline { stroke: var(--warn); stroke-width: 1; stroke-dasharray: 3 3; }
  .pf-ruintext { fill: var(--warn); font-family: var(--mono); font-size: 9px; }
  .pf-bar.pos { fill: var(--long); }
  .pf-bar.neg { fill: var(--warn); }
  .pf-bar.partial { opacity: 0.55; }
  .ch-legend .sw-pos { background: var(--long); height: 8px; }
  .ch-legend .sw-neg { background: var(--warn); height: 8px; }

  .pc-in { fill: var(--long); opacity: 0.13; }
  .pc-band { fill: var(--ink-faint); opacity: 0.16; stroke: none; }
  .pc-sma { fill: none; stroke: var(--ink-faint); stroke-width: 1.3; }
  .pc-price { fill: none; stroke: var(--ink); stroke-width: 1.4; }
  .ch-legend .sw-price { background: var(--ink); }
  .ch-legend .sw-sma { background: var(--ink-faint); }
  .ch-legend .sw-band { background: var(--ink-faint); opacity: 0.4; height: 8px; }
  .ch-legend .sw-inblock { background: var(--long); opacity: 0.35; height: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead"><h1>Strategy tracker</h1><span class="asof" id="asof"></span></div>
  <div id="status" class="loading">Loading&hellip;</div>
  <nav class="tabnav" id="tabnav" style="display:none;">
    <button class="tab active" data-tab="home">Home</button>
    <button class="tab" data-tab="developed">Developed strategies</button>
    <button class="tab" data-tab="explorer">S&amp;P Leverage explorer</button>
  </nav>
  <div id="tab-home"></div>
  <div id="tab-developed" style="display:none;"></div>
  <div id="tab-explorer" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/cost-model.js"></script>
<script src="js/strategy-engine.js"></script>
<script src="js/merge-series.js"></script>
<script src="js/odds.js"></script>
<script src="js/chart.js"></script>
<script src="js/price-chart.js"></script>
<script src="js/perf-chart.js"></script>
<script src="js/render-helpers.js"></script>
<script src="js/import-tools.js"></script>
<script src="js/home.js"></script>
<script src="js/developed.js"></script>
<script src="js/explorer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
